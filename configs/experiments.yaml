# Single source of truth for paths and parameters (single file, per-stage sections;
# confirmed 2026-11-13). Each module reads only its own section. Later days add
# `models`, `conformal` and `experiments` sections.

seed: 42

paths:                       # relative to the repo root
  raw_city_day: data/raw/city_day.csv
  processed_dir: data/processed
  tables_dir: outputs/tables
  figures_dir: outputs/figures
  predictions_dir: outputs/predictions
  processed_dataset: data/processed/forecast_dataset.parquet

data:
  source: "Kaggle: Air Quality Data in India (2015-2020), by Vopani (rohanrao/air-quality-data-in-india)"
  kaggle_version: 12
  license: CC0
  origin: CPCB
  sha256: 0d84b21c3e4878bbad8df362f2ab05f61ad959538dddf5918e714077ed3c1847
  n_rows: 29531
  n_cities: 26
  date_min: "2015-01-01"
  date_max: "2020-07-01"
  # quoted on purpose: unquoted NO is parsed by YAML 1.1 as boolean False
  columns: ["City", "Date", "PM2.5", "PM10", "NO", "NO2", "NOx", "NH3", "CO", "SO2", "O3",
            "Benzene", "Toluene", "Xylene", "AQI", "AQI_Bucket"]
  target: PM2.5

# Frozen design; splits are assigned by TARGET date. Ranges are inclusive.
splits:
  main:
    train: ["2015-01-01", "2017-12-31"]
    calibration: ["2018-01-01", "2018-12-31"]
    test: ["2019-01-01", "2019-12-31"]
  stress:
    train: ["2015-01-01", "2018-12-31"]
    calibration: ["2019-01-01", "2019-12-31"]
    test: ["2020-01-01", "2020-07-01"]
    lockdown_start: "2020-03-25"

# Periods used only for the completeness / gap audit (Day 1 item 3).
audit:
  periods:
    train_2015_2017: ["2015-01-01", "2017-12-31"]
    cal_2018: ["2018-01-01", "2018-12-31"]
    test_2019: ["2019-01-01", "2019-12-31"]
    stress_2020H1: ["2020-01-01", "2020-07-01"]
  gap_bins: [1, 2, 3, 7]     # report gaps of length 1, 2, 3-7, >7 days
  core_min_train_pct: 85.0   # sanity floor asserted in tests for core cities (train 2015-17)

cities:
  core: ["Delhi", "Lucknow", "Chennai", "Hyderabad", "Bengaluru"]
  transfer: ["Kolkata", "Mumbai"]                 # transfer-only targets, never core training
  transfer_optional: ["Visakhapatnam"]            # optional external held-out transfer

preprocessing:
  ffill_limit: 2             # forward-fill historical INPUT lags only; sensitivity run later: 3
                             # never fill y_t (origin) or the target; never bfill/interpolate

features:
  horizons: [1, 3, 7]
  lags: [1, 2, 3, 7]         # pm25_lag{k} = y_{t-k}; y_t itself is pm25_origin
  rolling_windows: [3, 7, 14]
  rolling_min_obs: {3: 2, 7: 4, 14: 7}   # on raw observed values in [t-w+1, t]
  calendar: [tgt_month, tgt_dow, tgt_doy_sin, tgt_doy_cos]   # of the TARGET date
  # never allowed in strict (protocol C) features:
  forbidden: ["AQI", "AQI_Bucket", "PM10", "NO", "NO2", "NOx", "NH3", "CO", "SO2", "O3",
              "Benzene", "Toluene", "Xylene"]

baselines:
  seasonal_period: 7         # seasonal naive: yhat[t+h] = y[t+h-7], raw observed only

# ---------------------------------------------------------------------------------
# Pre-Day-2 additions (confirmed 2026-11-14). No model is trained by Day 1 code.
# ---------------------------------------------------------------------------------

# Named model-input sets. Every experiment selects one of these by name.
feature_sets:
  # RQ1 protocols A and B ONLY (same-day estimation; intentionally non-causal inputs)
  same_day: ["AQI", "PM10", "NO", "NO2", "NOx", "NH3", "CO", "SO2", "O3",
             "Benzene", "Toluene", "Xylene",
             "tgt_month", "tgt_dow", "tgt_doy_sin", "tgt_doy_cos"]
  # Protocol C, RQ2 primary (pooled / per-city / LOCO), RQ3. City-ID-free.
  causal_common: ["pm25_origin", "pm25_lag1", "pm25_lag2", "pm25_lag3", "pm25_lag7",
                  "pm25_lag1_imputed", "pm25_lag2_imputed", "pm25_lag3_imputed", "pm25_lag7_imputed",
                  "pm25_rmean3", "pm25_rstd3", "pm25_rmean7", "pm25_rstd7",
                  "pm25_rmean14", "pm25_rstd14",
                  "tgt_month", "tgt_dow", "tgt_doy_sin", "tgt_doy_cos"]
  # Optional ablation: pooled model only, never LOCO. Unseen cities -> NaN.
  causal_city_aware: {extends: causal_common, add: ["city"]}

rq1:
  cities: core
  same_day_dataset: data/processed/rq1_same_day_dataset.parquet
  protocol_A:
    task: same_day_estimation
    feature_set: same_day
    split: random_unique_city_date
    pool_target_years: [2015, 2016, 2017, 2019]   # = B's train + test; 2018 reserved for CQR
    test_frac: 0.20
    stratify_by: city
  protocol_B:
    task: same_day_estimation
    feature_set: same_day
    split: chronological            # train 2015-2017, test 2019 (splits.main); 2018 unused
  protocol_C:
    task: forecast
    feature_set: causal_common
    horizons: [1, 3, 7]
    split: chronological            # splits.main by target date; eval on eval_mask
  b_vs_c_eval: common_city_date     # 2019 (city, target_date) with B row AND C eval_mask at h

rq2:
  primary_feature_set: causal_common
  ablation_feature_set: causal_city_aware   # pooled only
  train_cities: core
  loco_held_out: core                       # rotate over each core city (train on the other 4)
  transfer_eval: [transfer, transfer_optional]   # trained on all core cities, never trained on

# Hyperparameter rule (revised 2026-11-14): expanding-window CV over a small predeclared
# grid, strictly inside 2015-2017 by target date. 2018 (calibration) and 2019 (test) are
# never used for any choice. One selected set is reused by every experiment.
tuning:
  mode: expanding_cv               # expanding_cv | fixed
  status: proposed                 # grid + selection scope become 'frozen' on user approval
  allowed_target_range: ["2015-01-01", "2017-12-31"]
  expanding_cv_folds:
    - {train: ["2015-01-01", "2015-12-31"], valid: ["2016-01-01", "2016-12-31"]}
    - {train: ["2015-01-01", "2016-12-31"], valid: ["2017-01-01", "2017-12-31"]}
  metric: mae                      # validation MAE, mean over folds x horizons
  selection:                       # the data the grid is scored on
    dataset: forecast              # protocol C table
    cities: core
    feature_set: causal_common
    horizons: [1, 3, 7]            # one direct model per horizon per fold
  grid:                            # overrides models.lightgbm.params; 6 candidates
    num_leaves: [15, 31, 63]
    min_child_samples: [20, 50]
  refit: train_2015_2017           # final models refit on all split_main == train rows
  selected_params_file: outputs/tables/lightgbm_selected_params.json

models:
  lightgbm:
    status: proposed               # base values; tuned keys come from tuning.grid
    params:                        # base for every candidate; identical across RQ1-RQ3
      n_estimators: 500
      learning_rate: 0.05
      num_leaves: 31
      min_child_samples: 20
      subsample: 0.8               # bagging; only active because subsample_freq > 0
      subsample_freq: 1            # (= bagging_freq)
      bagging_seed: 42             # must equal top-level seed (tested)
      colsample_bytree: 0.8
      reg_lambda: 1.0
      deterministic: true          # reproducible; requires force_col_wise/row_wise
      force_col_wise: true
      n_jobs: 1
      verbose: -1
    point_objective: regression    # L2
    quantile_alphas: [0.05, 0.95]  # RQ3, objective = quantile
    early_stopping: false          # never; no data beyond the CV folds is consulted
