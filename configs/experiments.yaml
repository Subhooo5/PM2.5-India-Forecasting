seed: 42

paths:
  raw_city_day: data/raw/city_day.csv
  forecast_dataset: data/processed/forecast_dataset.parquet
  same_day_dataset: data/processed/leakage_same_day_dataset.parquet
  tables_dir: outputs/tables
  figures_dir: outputs/figures
  predictions_dir: outputs/predictions
  models_dir: outputs/models

data:
  source: "Kaggle: Air Quality Data in India (2015-2020), by Vopani (rohanrao/air-quality-data-in-india)"
  kaggle_version: 12
  sha256: 0d84b21c3e4878bbad8df362f2ab05f61ad959538dddf5918e714077ed3c1847
  n_rows: 29531
  n_cities: 26
  date_min: "2015-01-01"
  date_max: "2020-07-01"
  columns: ["City", "Date", "PM2.5", "PM10", "NO", "NO2", "NOx", "NH3", "CO", "SO2", "O3",
            "Benzene", "Toluene", "Xylene", "AQI", "AQI_Bucket"]
  target: PM2.5

splits:
  main:
    train: ["2015-01-01", "2017-12-31"]
    calibration: ["2018-01-01", "2018-12-31"]
    test: ["2019-01-01", "2019-12-31"]
  stress:
    train: ["2015-01-01", "2018-12-31"]
    calibration: ["2019-01-01", "2019-12-31"]
    test: ["2020-01-01", "2020-07-01"]
    lockdown_start: "2020-03-25"

audit:
  periods:
    train_2015_2017: ["2015-01-01", "2017-12-31"]
    cal_2018: ["2018-01-01", "2018-12-31"]
    test_2019: ["2019-01-01", "2019-12-31"]
    stress_2020H1: ["2020-01-01", "2020-07-01"]
  gap_bins: [1, 2, 3, 7]
  core_min_train_pct: 85.0

cities:
  core: ["Delhi", "Lucknow", "Chennai", "Hyderabad", "Bengaluru"]
  transfer: ["Kolkata", "Mumbai"]
  transfer_optional: ["Visakhapatnam"]

preprocessing:
  ffill_limit: 2

features:
  horizons: [1, 3, 7]
  lags: [1, 2, 3, 7]
  rolling_windows: [3, 7, 14]
  rolling_min_obs: {3: 2, 7: 4, 14: 7}
  calendar: [tgt_month, tgt_dow, tgt_doy_sin, tgt_doy_cos]
  forbidden: ["AQI", "AQI_Bucket", "PM10", "NO", "NO2", "NOx", "NH3", "CO", "SO2", "O3",
              "Benzene", "Toluene", "Xylene"]

baselines:
  seasonal_period: 7

feature_sets:
  causal_common: ["pm25_origin", "pm25_lag1", "pm25_lag2", "pm25_lag3", "pm25_lag7",
                  "pm25_lag1_imputed", "pm25_lag2_imputed", "pm25_lag3_imputed", "pm25_lag7_imputed",
                  "pm25_rmean3", "pm25_rstd3", "pm25_rmean7", "pm25_rstd7",
                  "pm25_rmean14", "pm25_rstd14",
                  "tgt_month", "tgt_dow", "tgt_doy_sin", "tgt_doy_cos"]
  same_day_estimation: ["AQI", "PM10", "NO", "NO2", "NOx", "NH3", "CO", "SO2", "O3",
                        "Benzene", "Toluene", "Xylene",
                        "tgt_month", "tgt_dow", "tgt_doy_sin", "tgt_doy_cos"]
  causal_city_aware: {extends: causal_common, add: ["city"]}

leakage:
  cities: core
  protocol_A:
    feature_set: same_day_estimation
    pool_target_years: [2015, 2016, 2017, 2019]
    test_frac: 0.20
    stratify_by: city
  protocol_B:
    feature_set: same_day_estimation
  protocol_C:
    feature_set: causal_common
    horizons: [1, 3, 7]

cross_city:
  feature_set: causal_common

lightgbm:
  base:
    objective: regression
    n_estimators: 500
    learning_rate: 0.05
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    reg_lambda: 1.0
    bagging_seed: 42
    random_state: 42
    n_jobs: 1
    deterministic: true
    force_col_wise: true
    verbosity: -1
  early_stopping: false
  grid:
    num_leaves: [15, 31, 63]
    min_child_samples: [20, 50]
    candidates:
      - {candidate_id: c1, num_leaves: 15, min_child_samples: 20}
      - {candidate_id: c2, num_leaves: 15, min_child_samples: 50}
      - {candidate_id: c3, num_leaves: 31, min_child_samples: 20}
      - {candidate_id: c4, num_leaves: 31, min_child_samples: 50}
      - {candidate_id: c5, num_leaves: 63, min_child_samples: 20}
      - {candidate_id: c6, num_leaves: 63, min_child_samples: 50}
  quantile_alphas: [0.05, 0.95]
  selected:
    candidate_id: c2
    num_leaves: 15
    min_child_samples: 50

tuning:
  folds:
    - {train_targets: "2015", validate_targets: "2016"}
    - {train_targets: "2015-2016", validate_targets: "2017"}
  horizons: [1, 3, 7]
  feature_set: causal_common
  cities: core
  eval_rows: eval_mask
  max_allowed_target_date: "2017-12-31"

uncertainty:
  quantiles: [0.05, 0.95]
  alpha: 0.10
  feature_set: causal_common
  cities: core
  horizons: [1, 3, 7]
  split_column: split_main
  aci:
    gamma: 0.02
    gamma_sensitivity: [0.005, 0.01, 0.02, 0.05]
    alpha_init: 0.10
    alpha_bounds: [0.01, 0.30]
  seasons:
    winter: [12, 1, 2]
    pre_monsoon: [3, 4, 5]
    monsoon: [6, 7, 8, 9]
    post_monsoon: [10, 11]
  regime:
    top_fraction: 0.10

stress_test:
  split_column: split_stress
  period_column: stress_period
  cities: core
  horizons: [1, 3, 7]
  feature_set: causal_common
  expected_test_days: {pre_lockdown: 84, lockdown: 99}
